name: Build KStore source

on:
  push:
    branches: [main]
    paths:
      - "repositories.json"
      - "scripts/**"
      - "schemas/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kstore-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install -r requirements.txt

      - name: Read the configured Pages URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          page_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)"
          if [ -z "$page_url" ]; then
            echo "GitHub Pages is not configured for this repository." >&2
            exit 1
          fi
          echo "KSTORE_BASE_URL=${page_url%/}" >> "$GITHUB_ENV"

      - name: Restore IPA metadata cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/kstore
          key: kstore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kstore-

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Build and validate SideStore source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_source.py

      - name: Save IPA metadata cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/kstore
          key: kstore-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
