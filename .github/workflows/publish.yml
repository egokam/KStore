name: Build KStore source

on:
  push:
    branches: [main]
    paths:
      - "repositories.json"
      - "scripts/**"
      - "schemas/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kstore-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install -r requirements.txt

      - name: Read the configured Pages URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          page_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)"
          if [ -z "$page_url" ]; then
            echo "GitHub Pages is not configured for this repository." >&2
            exit 1
          fi
          echo "KSTORE_BASE_URL=${page_url%/}" >> "$GITHUB_ENV"

      - name: Restore IPA metadata cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kstore
          key: kstore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kstore-

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Build and validate SideStore source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_source.py

      - name: Save IPA metadata cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kstore
          key: kstore-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
